<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">

      <defs>
        <pattern id="rules" width="28" height="28" patternUnits="userSpaceOnUse">
          <line x1="0" y1="27" x2="28" y2="27" stroke="rgba(74,63,92,0.08)" stroke-width="1"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8E86A0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E4572E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAF4E8"/>
      <rect width="100%" height="100%" fill="url(#rules)" opacity="0.6"/>

      <!-- Actor heads -->
      <rect x="60" y="36" width="160" height="44" rx="6" fill="#DFF0E3" stroke="#4A3F5C" stroke-width="1"/>
      <text x="140" y="63" fill="#4A3F5C" font-size="14" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Page</text>
      <rect x="340" y="36" width="160" height="44" rx="6" fill="rgba(228,87,46,0.12)" stroke="#E4572E" stroke-width="1"/>
      <text x="420" y="63" fill="#4A3F5C" font-size="14" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Controller</text>
      <rect x="620" y="36" width="160" height="44" rx="6" fill="#FBEFD4" stroke="#4A3F5C" stroke-width="1"/>
      <text x="700" y="63" fill="#4A3F5C" font-size="14" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Validation</text>
      <rect x="820" y="36" width="140" height="44" rx="6" fill="#E8DFF3" stroke="#4A3F5C" stroke-width="1"/>
      <text x="890" y="63" fill="#4A3F5C" font-size="14" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">JPA</text>

      <!-- Lifelines -->
      <line x1="140" y1="80" x2="140" y2="500" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <line x1="420" y1="80" x2="420" y2="500" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <line x1="700" y1="80" x2="700" y2="500" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <line x1="890" y1="80" x2="890" y2="500" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

      <!-- Activation bars -->
      <rect x="414" y="108" width="12" height="140" rx="2" fill="rgba(142,134,160,0.35)"/>
      <rect x="414" y="276" width="12" height="120" rx="2" fill="rgba(228,87,46,0.40)"/>
      <rect x="414" y="424" width="12" height="44" rx="2" fill="rgba(142,134,160,0.35)"/>
      <rect x="694" y="300" width="12" height="36" rx="2" fill="rgba(142,134,160,0.35)"/>
      <rect x="884" y="140" width="12" height="36" rx="2" fill="rgba(142,134,160,0.35)"/>
      <rect x="884" y="348" width="12" height="24" rx="2" fill="rgba(142,134,160,0.35)"/>

      <!-- 1. List -->
      <line x1="140" y1="116" x2="412" y2="116" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="276" y="108" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">GET /api/referrals</text>
      <line x1="428" y1="148" x2="882" y2="148" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="655" y="140" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">findAll newest-first</text>
      <line x1="882" y1="172" x2="428" y2="172" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="655" y="164" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">rows</text>
      <line x1="412" y1="204" x2="148" y2="204" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="280" y="196" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">200 · [] when empty</text>

      <!-- 2. Create -->
      <line x1="140" y1="284" x2="412" y2="284" stroke="#E4572E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="276" y="276" fill="#E4572E" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">POST · no id/status</text>
      <line x1="428" y1="308" x2="692" y2="308" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="560" y="300" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">@Valid</text>
      <line x1="692" y1="332" x2="428" y2="332" stroke="#8E86A0" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="560" y="324" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">violations?</text>
      <line x1="428" y1="356" x2="882" y2="356" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="655" y="348" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">save as NEW</text>
      <line x1="412" y1="388" x2="148" y2="388" stroke="#E4572E" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
      <text x="280" y="380" fill="#E4572E" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">201 record</text>

      <!-- Failure branch note -->
      <rect x="480" y="404" width="440" height="32" rx="16" fill="rgba(228,87,46,0.12)" stroke="#E4572E" stroke-width="1"/>
      <text x="700" y="424" fill="#4A3F5C" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Invalid input → 400 message + fieldErrors</text>

      <!-- 3. Status -->
      <line x1="140" y1="460" x2="412" y2="460" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="276" y="452" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">PATCH /{id}/status</text>
      <rect x="480" y="472" width="440" height="32" rx="6" fill="#FFFDFB" stroke="#4A3F5C" stroke-width="1"/>
      <text x="700" y="492" fill="#4A3F5C" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Unknown id → 404 · known id → 200, status only</text>

      <!-- Legend -->
      <line x1="40" y1="524" x2="960" y2="524" stroke="rgba(74,63,92,0.14)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#8E86A0" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.18em">LEGEND · DASHED IS A RESPONSE</text>
      <line x1="40" y1="548" x2="68" y2="548" stroke="#E4572E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="76" y="552" fill="#8E86A0" font-size="10.5" font-family="'Space Grotesk', sans-serif">Create path (focal)</text>
      <line x1="280" y1="548" x2="308" y2="548" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="316" y="552" fill="#8E86A0" font-size="10.5" font-family="'Space Grotesk', sans-serif">Call</text>
    </svg>