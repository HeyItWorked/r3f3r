<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc">

      <defs>
        <pattern id="rules" width="28" height="28" patternUnits="userSpaceOnUse">
          <line x1="0" y1="27" x2="28" y2="27" stroke="rgba(74,63,92,0.08)" stroke-width="1"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8E86A0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E4572E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAF4E8"/>
      <rect width="100%" height="100%" fill="url(#rules)" opacity="0.6"/>

      <!-- Initial -->
      <circle cx="60" cy="190" r="8" fill="#E4572E"/>
      <line x1="68" y1="190" x2="116" y2="190" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="92" y="178" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">POST</text>

      <!-- Forward lane (top) -->
      <line x1="276" y1="162" x2="420" y2="162" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="348" y="152" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">save</text>
      <line x1="580" y1="162" x2="724" y2="162" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="652" y="152" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">save</text>

      <!-- Backward lane (bottom) -->
      <line x1="724" y1="218" x2="580" y2="218" stroke="#E4572E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="652" y="238" fill="#E4572E" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">corrects · re-arms overdue</text>
      <line x1="420" y1="218" x2="276" y2="218" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="348" y="238" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">corrects</text>

      <!-- Long corrections -->
      <line x1="800" y1="226" x2="800" y2="272" stroke="#8E86A0" stroke-width="1" opacity="0.7"/>
      <line x1="800" y1="272" x2="200" y2="272" stroke="#8E86A0" stroke-width="1" opacity="0.7"/>
      <line x1="200" y1="272" x2="200" y2="234" stroke="#8E86A0" stroke-width="1" opacity="0.7" marker-end="url(#arrow)"/>
      <text x="500" y="290" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">DONE → NEW corrects directly</text>

      <!-- No-op loops -->
      <line x1="170" y1="140" x2="170" y2="112" stroke="#8E86A0" stroke-width="1" opacity="0.7"/>
      <line x1="170" y1="112" x2="226" y2="112" stroke="#8E86A0" stroke-width="1" opacity="0.7"/>
      <line x1="226" y1="112" x2="226" y2="136" stroke="#8E86A0" stroke-width="1" opacity="0.7" marker-end="url(#arrow)"/>
      <text x="198" y="102" fill="#8E86A0" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">same = no-op</text>

      <!-- State nodes -->
      <rect x="120" y="150" width="152" height="80" rx="28" fill="#DFF0E3" stroke="#4A3F5C" stroke-width="1"/>
      <text x="196" y="184" fill="#4A3F5C" font-size="15" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">NEW</text>
      <text x="196" y="202" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">default on POST</text>

      <rect x="424" y="150" width="152" height="80" rx="28" fill="#FBEFD4" stroke="#4A3F5C" stroke-width="1"/>
      <text x="500" y="184" fill="#4A3F5C" font-size="15" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">SENT</text>
      <text x="500" y="202" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">in flight</text>

      <rect x="728" y="150" width="152" height="80" rx="28" fill="rgba(228,87,46,0.12)" stroke="#E4572E" stroke-width="1"/>
      <text x="804" y="184" fill="#4A3F5C" font-size="15" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">DONE</text>
      <text x="804" y="202" fill="#8E86A0" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">silences overdue</text>

      <!-- Overdue rule card -->
      <rect x="120" y="320" width="760" height="64" rx="6" fill="#FFFDFB" stroke="#4A3F5C" stroke-width="1"/>
      <rect x="121" y="321" width="5" height="62" fill="#E4572E"/>
      <text x="140" y="346" fill="#4A3F5C" font-size="13" font-weight="600" font-family="'Space Grotesk', sans-serif">Overdue = followUpDate &lt; today AND status ≠ DONE</text>
      <text x="140" y="364" fill="#8E86A0" font-size="12" font-family="'IBM Plex Mono', monospace">backend-computed, never stored · today is not overdue · yesterday is</text>

      <!-- Legend -->
      <line x1="40" y1="412" x2="960" y2="412" stroke="rgba(74,63,92,0.14)" stroke-width="0.8"/>
      <text x="40" y="428" fill="#8E86A0" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.18em">LEGEND · EVERY ARROW IS A SAVE</text>
      <line x1="40" y1="440" x2="68" y2="440" stroke="#E4572E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="76" y="444" fill="#8E86A0" font-size="10.5" font-family="'Space Grotesk', sans-serif">Re-arms overdue (focal)</text>
      <line x1="340" y1="440" x2="368" y2="440" stroke="#8E86A0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="376" y="444" fill="#8E86A0" font-size="10.5" font-family="'Space Grotesk', sans-serif">Move / correct</text>
    </svg>